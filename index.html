<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regolith</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/editor/ui/styles.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <div class="hud-title">REGOLITH <span class="hud-sub">pre-alpha</span></div>
      <div class="hud-clock" id="clock"></div>
      <div class="hud-hint">
        middle-drag or Alt+drag: orbit · right-drag: pan · wheel: zoom · [ ] scrub time · Space
        pause · . speed · Q/E turn view · F2 quality
      </div>
    </div>
    <div id="handles"></div>
    <div id="halos"></div>
    <div id="suggest"></div>
    <div id="params" hidden></div>
    <div id="tip" hidden></div>
    <div id="tray"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
